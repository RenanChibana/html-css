<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 500px;
        }

        td, th {
            border: 1px solid black;
            text-align: center;
            padding: 7px;
        }

        caption {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }

        col.colnome {
            background-color: lightseagreen;
        }

        .colsexo {
            background-color: lightcyan;
        }

        .colidade {
            background-color: lightgreen;
        }

        .colprofissao {
            background-color: lightsteelblue;
        }

    </style>
</head>
<body>
    <h1>Tabelas</h1>

    <table>
        <colgroup>
            <col class="colnome">
            <col class="colsexo" span="2"> <!-- ele expande a cor para a próxima coluna -->
            <col class="colidade">
            <col class="colprofissao"> <!-- a cor desta última coluna foi ignorada, pois houve uma expansão anterior -->
        </colgroup>
        <caption>
            Cadastro de Pessoas
        </caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Cláudio</td>
                <td>M</td>
                <td>28</td>
                <td>Programador</td>
            </tr>    
            <tr>
                <td>Gustavo</td>
                <td>M</td>
                <td>42</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Hélio</td>
                <td>M</td>
                <td>19</td>
                <td>Vendedor</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>F</td>
                <td>39</td>
                <td>Médica</td>
            </tr>
            <tr>
                <td>Otávio</td>
                <td>M</td>
                <td>22</td>
                <td>Nutricionista</td>
            </tr>    
        </tbody>
    </table>

</body>
</html>
