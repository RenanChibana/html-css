<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            height: 300px;
            display: flex;
            flex-flow: row nowrap;
            justify-content: space-evenly;
            align-items: center;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Elemento A</div>
        <div class="item">Elemento B</div>    
        <div class="item">Elemento C</div>
        <div class="item">Elemento D</div>
        <div class="item">Elemento E</div>
        <div class="item">Elemento F</div>
        <div class="item">Elemento G</div>    
    </div>
</body>
</html>
