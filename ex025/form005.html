<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <input type="radio" name="sexo" id="imasc" value="M">
                <label for="imasc">Masculino</label><br>
            </p>
            <p>
                <input type="radio" name="sexo" id="ifem" value="F">
                <label for="ifem">Feminino</label><br>
            </p>
        </fieldset>
        <fieldset>
            <legend>Esporte Favorito</legend>
            <p>
                <input type="checkbox" name="fut" id="ifut" checked>
                <label for="ifut">Futebol</label>
            </p>
            <p>
                <input type="checkbox" name="volei" id="ivol">
                <label for="ivol">Vôlei</label>
            </p>
            <p>
                <input type="checkbox" name="bas" id="ibas">
                <label for="ibas">Basquete</label>
            </p>
            <p>
                <input type="checkbox" name="ten" id="iten" checked>
                <label for="iten">Tênis</label>
            </p>
            <p>
                <input type="checkbox" name="base" id="ibase">
                <label for="ibase">Baseball</label>
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
